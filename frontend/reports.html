<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports | CMS+</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='common.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{{ url_for('api.admin_dashboard') }}">🛡️ Admin Panel</a>
    <div class="ms-auto d-flex gap-2">
      <a href="{{ url_for('api.admin_dashboard') }}" class="btn btn-outline-light btn-sm">Dashboard</a>
      <a href="{{ url_for('api.students') }}" class="btn btn-outline-light btn-sm">Students</a>
      <a href="{{ url_for('api.logout') }}" class="btn btn-light btn-sm">Logout</a>
    </div>
  </div>
</nav>

<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="section-title mb-0">Reports</h1>
    <a href="{{ url_for('api.admin_dashboard') }}" class="btn btn-outline-light">Back</a>
  </div>

  <div class="row g-4">
    <div class="col-md-4">
      <div class="glass p-4">
        <h4>Total Students</h4>
        <h2 id="report-students">0</h2>
      </div>
    </div>
    <div class="col-md-4">
      <div class="glass p-4">
        <h4>Enrolled Courses</h4>
        <h2 id="report-courses">0</h2>
      </div>
    </div>
    <div class="col-md-4">
      <div class="glass p-4">
        <h4>Completed Lessons</h4>
        <h2 id="report-completed">0</h2>
      </div>
    </div>
  </div>
</div>

<footer><p>© 2026 Course Management System+</p></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="form-validation.js"></script>
<script src="page-app.js"></script>
<script>
  (function () {
    const users = JSON.parse(localStorage.getItem('cms_users') || '[]');
    const enrollments = JSON.parse(localStorage.getItem('cms_enrollments') || '[]');
    const courses = JSON.parse(localStorage.getItem('course-data') || '[]');

    document.getElementById('report-students').textContent = users.filter((user) => user.role === '3').length;
    document.getElementById('report-courses').textContent = enrollments.length;
    document.getElementById('report-completed').textContent = Math.max(0, Math.min(25, enrollments.length * 3));
  })();
</script>
</body>
</html>
