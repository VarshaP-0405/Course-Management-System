<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Faculty | CMS+</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='responsive.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('api.admin_dashboard') }}">Admin Panel</a>
        <a href="{{ url_for('api.logout') }}" class="btn btn-light btn-sm">Logout</a>
    </div>
</nav>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header text-center"><h3>Add Faculty Member</h3></div>
                <div class="card-body">
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endwith %}
                    <form method="POST">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">First Name *</label>
                                <input class="form-control" name="first_name" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Last Name *</label>
                                <input class="form-control" name="last_name" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email *</label>
                                <input class="form-control" type="email" name="email" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Temporary Password *</label>
                                <input class="form-control" type="password" name="password" minlength="6" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Employee ID *</label>
                                <input class="form-control" name="employee_id" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Phone</label>
                                <input class="form-control" name="phone">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Department *</label>
                                <input class="form-control" name="department" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Qualification *</label>
                                <input class="form-control" name="qualification" placeholder="M.Tech, Ph.D., etc." required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Specialization *</label>
                                <input class="form-control" name="specialization" placeholder="Artificial Intelligence, Web Development, etc." required>
                            </div>
                        </div>
                        <div class="mt-4 d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Create Faculty Account</button>
                            <a href="{{ url_for('api.admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
