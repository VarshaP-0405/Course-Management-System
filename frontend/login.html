<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CMS+ Login Portal</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='common.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='responsive.css') }}">


</head>



<body>



<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark">

<div class="container">


<a class="navbar-brand fw-bold" href="{{ url_for('api.home') }}">

🎓 CMS+ Portal

</a>



<div class="ms-auto">

<a href="{{ url_for('api.home') }}" 
class="btn btn-outline-light btn-sm">

Home

</a>

</div>


</div>

</nav>




<!-- LOGIN -->

<div class="login-box">


<h2>Welcome Back</h2>

<p class="subtitle">
Login as Admin, Faculty or Student
</p>



<form action="{{ url_for('api.login') }}" method="POST" data-validate-form="login" novalidate>



<!-- ROLE -->

<div class="mb-3">


<select 
name="role"
class="form-control"
required>


<option value="" disabled selected>
Select Role
</option>


<option value="1">
Admin
</option>


<option value="2">
Faculty
</option>


<option value="3">
Student
</option>


</select>


</div>




<!-- EMAIL -->


<div class="mb-3">


<input

type="email"

name="email"

class="form-control"

placeholder="Email Address"

required>


</div>




<!-- PASSWORD -->


<div class="mb-3">


<input

type="password"

name="password"

class="form-control"

placeholder="Password"

required>


</div>




<!-- LOGIN BUTTON -->


<button 

type="submit"

class="btn btn-login w-100">


Login


</button>



</form>




<div class="links">


<p>

<a href="{{ url_for('api.forgot_password') }}">

Forgot Password?

</a>

</p>



<p>

New User?

<a href="{{ url_for('api.register') }}">

Create Account

</a>


</p>



</div>



</div>






<footer>


<p>
© 2026 Course Management System+
</p>


</footer>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="form-validation.js"></script>
<script src="page-app.js"></script>


</body>

</html>
