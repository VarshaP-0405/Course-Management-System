<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | CMS+</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='common.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='responsive.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{{ url_for('api.home') }}">🎓 CMS+</a>
    <div class="ms-auto d-flex gap-2">
      <a href="{{ url_for('api.home') }}" class="btn btn-outline-light btn-sm">Home</a>
      <a href="{{ url_for('api.student_dashboard') }}" class="btn btn-outline-light btn-sm">Dashboard</a>
      <a href="{{ url_for('api.profile') }}" class="btn btn-light btn-sm">Profile</a>
      <a href="{{ url_for('api.logout') }}" class="btn btn-outline-light btn-sm" data-auth-action="logout">Logout</a>
    </div>
  </div>
</nav>

<div class="container py-5">
  <div class="row g-4">
    <div class="col-lg-4">
      <div class="glass p-4 text-center">
        <h3 data-user-greeting>My Profile</h3>
        <p class="text-muted">Manage your account details and preferences.</p>
        <div class="mt-4">
          <a href="{{ url_for('api.progress') }}" class="btn btn-register w-100 mb-2">View Progress</a>
          <a href="{{ url_for('api.notifications') }}" class="btn btn-outline-light w-100">Notifications</a>
        </div>
      </div>
    </div>
    <div class="col-lg-8">
      <div class="glass p-4">
        <h4>Account details</h4>
        <form method="POST" data-validate-form="profile" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Full Name</label>
              <input class="form-control" name="full_name" value="{{ profile.full_name }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input class="form-control" type="email" name="email" value="{{ profile.email }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input class="form-control" name="phone" value="{{ profile.phone }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Department</label>
              <input class="form-control" name="department" value="{{ profile.department }}">
            </div>
          </div>
          <button class="btn btn-register mt-4">Save Profile</button>
        </form>
      </div>
    </div>
  </div>
</div>

<footer><p>© 2026 Course Management System+</p></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="form-validation.js"></script>
<script src="page-app.js"></script>
</body>
</html>
