<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse Courses</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='common.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='responsive.css') }}">

</head>
<body>

<div class="container mt-5">

<h2 class="text-center mb-4">Available Courses</h2>

<div class="row">

{% for course in courses %}

<div class="col-md-4 mb-4">

<div class="card h-100">

<div class="card-body">

<h4>{{ course.course_name }}</h4>

<p><strong>Code :</strong> {{ course.course_code }}</p>

<p><strong>Instructor :</strong> {{ course.instructor }}</p>

<p><strong>Duration :</strong> {{ course.duration }}</p>

<p><strong>Credits :</strong> {{ course.credits }}</p>

<a href="{{ url_for('api.course_details', course_id=course.id) }}"
class="btn btn-primary">
View Details
</a>

<a href="{{ url_for('api.enroll_course', course_id=course.id) }}"
class="btn btn-success">
Enroll
</a>

</div>

</div>

</div>

{% endfor %}

</div>

<div class="text-center mt-3">

<a href="{{ url_for('api.student_dashboard') }}"
class="btn btn-secondary">
Back
</a>

</div>

</div>

<script src="form-validation.js"></script>
<script src="page-app.js"></script>
</body>
</html>
