<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students | CMS+</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='common.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='responsive.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{{ url_for('api.admin_dashboard') }}">🛡️ Admin Panel</a>
    <div class="ms-auto d-flex gap-2">
      <a href="{{ url_for('api.admin_dashboard') }}" class="btn btn-outline-light btn-sm">Dashboard</a>
      <a href="{{ url_for('api.reports') }}" class="btn btn-outline-light btn-sm">Reports</a>
      <a href="{{ url_for('api.logout') }}" class="btn btn-light btn-sm">Logout</a>
    </div>
  </div>
</nav>

<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="section-title mb-0">Registered Students</h1>
    <a href="{{ url_for('api.admin_dashboard') }}" class="btn btn-outline-light">Back</a>
  </div>

  <div class="glass p-4">
    <table class="table table-dark table-striped align-middle">
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="students-table-body"></tbody>
    </table>
  </div>
</div>

<footer><p>© 2026 Course Management System+</p></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="form-validation.js"></script>
<script src="page-app.js"></script>
<script>
  (function () {
    const students = JSON.parse(localStorage.getItem('cms_users') || '[]');
    const tbody = document.getElementById('students-table-body');
    if (!tbody) return;

    if (!students.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-center">No students registered yet.</td></tr>';
      return;
    }

    tbody.innerHTML = students.map((student, index) => `
      <tr>
        <td>${index + 1}</td>
        <td>${student.first_name || 'Student'} ${student.last_name || ''}</td>
        <td>${student.email}</td>
        <td>${student.role === '1' ? 'Admin' : student.role === '2' ? 'Faculty' : 'Student'}</td>
        <td>Active</td>
      </tr>
    `).join('');
  })();
</script>
</body>
</html>
